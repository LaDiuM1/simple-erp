name: simple-erp-demo

# Production compose의 서비스 정의만 재사용하는 데모 overlay다.
# 실행 시 항상 두 파일과 project name을 명시한다.
x-demo-logging: &demo-logging
  driver: local
  options:
    max-size: "10m"
    max-file: "3"

x-demo-tool-common: &demo-tool-common
  image: python:3.13-alpine@sha256:399babc8b49529dabfd9c922f2b5eea81d611e4512e3ed250d75bd2e7683f4b0
  profiles: ["tools"]
  entrypoint: ["python", "/opt/demo-control.py"]
  user: "0:10001"
  environment:
    PYTHONDONTWRITEBYTECODE: "1"
    TZ: Asia/Seoul
  read_only: true
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  logging: *demo-logging
  deploy:
    resources:
      limits:
        memory: 128M

services:
  db:
    image: mariadb:11.8.6
    ports: !override []
    environment:
      MARIADB_ROOT_PASSWORD: ${DEMO_DB_ROOT_PASSWORD:?host-only reset credential is required}
      MARIADB_DATABASE: simple_erp_demo
      MARIADB_USER: simple_erp_app
      MARIADB_PASSWORD: ${DB_PASSWORD:?demo app DB password is required}
      MARIADB_USER_HOST: "%"
      TZ: Asia/Seoul
    volumes: !override
      - demo_db_data:/var/lib/mysql
      - ./scripts/demo/init-app-user.sh:/docker-entrypoint-initdb.d/90-demo-least-privilege.sh:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    logging: *demo-logging

  backend:
    image: ${BACKEND_IMAGE:?demo backend image is required}
    environment:
      SPRING_PROFILES_ACTIVE: demo
      DB_URL: jdbc:mariadb://db:3306/simple_erp_demo?characterEncoding=UTF-8&serverTimezone=Asia/Seoul
      DB_USERNAME: simple_erp_app
      DB_PASSWORD: ${DB_PASSWORD:?demo app DB password is required}
      JWT_SECRET: ${JWT_SECRET:?demo JWT secret is required}
      JWT_EXPIRATION: "60"
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?demo HTTPS origin is required}
      APP_ADMIN_LOGIN_ID: ${APP_ADMIN_LOGIN_ID:?recovery operator login is required}
      APP_ADMIN_PASSWORD: ${APP_ADMIN_PASSWORD:?recovery operator password is required}
      DDL_AUTO: validate
      APP_SCHEMA_MAINTENANCE_ENABLED: "false"
      APP_REFERENCE_BOOTSTRAP_ENABLED: "false"
      APP_ADMIN_BOOTSTRAP_ENABLED: "true"
      DEMO_ENABLED: "true"
      DEMO_ENVIRONMENT_NAME: DEMO
      DEMO_STATE_PATH: /app/data/demo-state/status.json
      DEMO_AUDIT_STORE_CLIENT_IP: "false"
      DEMO_USE_SIMULATED_POSITION: "true"
      DEMO_SIMULATED_LATITUDE: "37.5663"
      DEMO_SIMULATED_LONGITUDE: "126.9779"
      DEMO_UPLOAD_ENABLED: "true"
      DEMO_RESET_WARNING_BEFORE: PT5M
      DEMO_RESET_WRITE_LOCK_BEFORE: PT2M
      DEMO_RESET_OPERATION_TIMEOUT: PT20M
      DEMO_SEED_VALIDATION_ENABLED: "true"
      DEMO_SEED_EXPECTED_VERSION: ${DEMO_SEED_EXPECTED_VERSION:?seed version is required}
      STORAGE_BASE_PATH: /app/data/files/current
      TZ: Asia/Seoul
    volumes: !override
      - demo_files:/app/data/files
      - ./runtime/state:/app/data/demo-state:ro
    security_opt:
      - no-new-privileges:true
    logging: *demo-logging

  web:
    image: ${WEB_IMAGE:?demo web image is required}
    depends_on: !override []
    ports: !override
      - "${DEMO_HTTP_BIND:-0.0.0.0}:${DEMO_HTTP_PORT:-80}:80"
      - "${DEMO_HTTPS_BIND:-0.0.0.0}:${DEMO_HTTPS_PORT:-443}:443"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?demo site address is required}
      API_REQUEST_BODY_MAX_SIZE: 32MB
      TZ: Asia/Seoul
    volumes: !override
      - demo_caddy_data:/data
      - demo_caddy_config:/config
      - ./runtime/state:/srv/demo:ro
    security_opt:
      - no-new-privileges:true
    logging: *demo-logging

  demo-tool:
    <<: *demo-tool-common
    network_mode: none
    volumes:
      - type: bind
        source: ./scripts/demo/demo_control.py
        target: /opt/demo-control.py
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./demo/seed
        target: /seed
        read_only: true
        bind:
          create_host_path: false
      - ./runtime/state:/state
      - ./runtime/work:/work
      - ./runtime/logs:/logs
      - demo_files:/files

  demo-tool-smoke:
    <<: *demo-tool-common
    volumes:
      - type: bind
        source: ./scripts/demo/demo_control.py
        target: /opt/demo-control.py
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./demo/seed
        target: /seed
        read_only: true
        bind:
          create_host_path: false

volumes:
  demo_db_data:
    name: simple-erp-demo-db-data
  demo_files:
    name: simple-erp-demo-files
  demo_caddy_data:
    name: simple-erp-demo-caddy-data
  demo_caddy_config:
    name: simple-erp-demo-caddy-config
