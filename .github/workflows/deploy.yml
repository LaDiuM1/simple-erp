name: Deploy to EC2

on:
  workflow_dispatch:
    inputs:
      tag:
        description: '배포할 이미지 태그 (sha- + 40자리 commit)'
        required: true

permissions: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Lowercase repo owner
        run: echo "OWNER=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Resolve image tag
        env:
          REQUESTED_TAG: ${{ inputs.tag }}
        run: |
          TAG="${REQUESTED_TAG}"
          if [[ ! "${TAG}" =~ ^sha-[0-9a-f]{40}$ ]]; then
            echo "Unsupported image tag: ${TAG}" >&2
            exit 1
          fi
          echo "IMAGE_TAG=${TAG}" >> "$GITHUB_ENV"

      - name: SSH deploy
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            bash -s <<'DEPLOY_SCRIPT'
            set -euo pipefail
            cd /opt/simple-erp

            # GHCR 패키지가 public 이라 anonymous pull 가능 — docker login 불필요.
            # private 전환 시에는 secret expression을 third-party action 입력에 직접 넣지 않고,
            # 최소 권한 로그인 단계를 별도 검토해 추가한다.

            # 이미지 태그 override (.env 의 BACKEND_IMAGE / WEB_IMAGE 보다 우선)
            export BACKEND_IMAGE="ghcr.io/${{ env.OWNER }}/simple-erp-backend:${{ env.IMAGE_TAG }}"
            export WEB_IMAGE="ghcr.io/${{ env.OWNER }}/simple-erp-web:${{ env.IMAGE_TAG }}"

            container_id() {
              docker compose ps -q "$1" 2>/dev/null || true
            }

            # 실패 시 현재 정상 이미지 조합을 복원할 수 있도록 실제 실행 중인 참조를 보존한다.
            PREVIOUS_BACKEND_CONTAINER="$(container_id backend)"
            PREVIOUS_WEB_CONTAINER="$(container_id web)"
            PREVIOUS_BACKEND_IMAGE="$(docker inspect --format '{{.Config.Image}}' \
              "${PREVIOUS_BACKEND_CONTAINER}" 2>/dev/null || true)"
            PREVIOUS_WEB_IMAGE="$(docker inspect --format '{{.Config.Image}}' \
              "${PREVIOUS_WEB_CONTAINER}" 2>/dev/null || true)"

            probe_backend() {
              local backend_container readiness
              backend_container="$(container_id backend)"
              [[ -n "${backend_container}" ]] || return 1
              readiness="$(docker exec "${backend_container}" \
                curl -fsS http://localhost:8080/actuator/health/readiness 2>/dev/null || true)"
              readiness="${readiness//[[:space:]]/}"
              [[ "${readiness}" == '{"status":"UP"}' ]]
            }

            probe_web_origin() {
              local web_container site_address origin authority host port status
              local -a curl_options
              web_container="$(container_id web)"
              [[ -n "${web_container}" ]] || return 1
              site_address="$(docker inspect --format '{{range .Config.Env}}{{println .}}{{end}}' \
                "${web_container}" 2>/dev/null | sed -n 's/^SITE_ADDRESS=//p' | head -n 1)"

              case "${site_address}" in
                ""|":80") origin="http://127.0.0.1" ;;
                http://*|https://*) origin="${site_address%/}" ;;
                *) origin="https://${site_address%/}" ;;
              esac

              curl_options=(-sS --max-time 10 -o /dev/null -w '%{http_code}')
              if [[ "${origin}" != "http://127.0.0.1" ]]; then
                authority="${origin#*://}"
                authority="${authority%%/*}"
                host="${authority%%:*}"
                if [[ "${authority}" == *:* ]]; then
                  port="${authority##*:}"
                elif [[ "${origin}" == https://* ]]; then
                  port="443"
                else
                  port="80"
                fi
                curl_options+=(--resolve "${host}:${port}:127.0.0.1")
              fi

              status="$(curl "${curl_options[@]}" "${origin}/" 2>/dev/null || true)"
              [[ "${status}" == "200" ]]
            }

            wait_for_pair() {
              local label="$1"
              for i in $(seq 1 45); do
                if probe_backend && probe_web_origin; then
                  echo "${label} image pair ready (after ${i} attempts)"
                  return 0
                fi
                sleep 2
              done
              return 1
            }

            rollback() {
              if [[ -z "${PREVIOUS_BACKEND_IMAGE}" || -z "${PREVIOUS_WEB_IMAGE}" ]]; then
                echo "No previous image pair available for rollback" >&2
                return 1
              fi
              echo "Restoring previous image pair..."
              export BACKEND_IMAGE="${PREVIOUS_BACKEND_IMAGE}"
              export WEB_IMAGE="${PREVIOUS_WEB_IMAGE}"
              if ! docker compose up -d --remove-orphans backend web; then
                echo "Rollback compose up failed" >&2
                return 1
              fi
              if ! wait_for_pair "Previous"; then
                echo "Rollback readiness check failed" >&2
                return 1
              fi
              echo "Previous image pair restored"
            }

            docker compose pull backend web
            if ! docker compose up -d --remove-orphans backend web; then
              echo "Deployment compose up failed" >&2
              if rollback; then
                echo "Deployment start failed; previous image pair restored" >&2
              else
                echo "Deployment start failed and rollback failed" >&2
              fi
              exit 1
            fi

            if wait_for_pair "New"; then
              docker image prune -f || true
              exit 0
            fi

            echo "Deployment readiness check failed" >&2
            docker compose logs --tail=100 backend web || true
            if rollback; then
              echo "Deployment failed; previous image pair restored" >&2
            else
              echo "Deployment and rollback both failed" >&2
            fi
            exit 1
            DEPLOY_SCRIPT
