spring.application.name=simple-erp
# 로컬 dev 시크릿 로드 — backend/.env.local (루트의 배포용 .env 와 이름이 겹치지 않게). 없으면 무시 -> 운영/CI 는 실제 환경변수
spring.config.import=optional:file:.env.local[.properties],optional:file:backend/.env.local[.properties]
# DB 설정
spring.datasource.url=${DB_URL:jdbc:mariadb://localhost:3380/simple_erp?characterEncoding=UTF-8&serverTimezone=Asia/Seoul}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_batch_fetch_size=100
# JPA — env 토글 (prod: DDL_AUTO=update, JPA_SHOW_SQL=false, JPA_FORMAT_SQL=false)
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=${JPA_FORMAT_SQL:true}
# 시간대 — JVM TZ 와 무관하게 응답 직렬화는 KST 고정
spring.jackson.time-zone=Asia/Seoul
# 페이징 기본값
spring.data.web.pageable.default-page-size=20
spring.data.web.pageable.max-page-size=100
spring.data.web.pageable.one-indexed-parameters=false
# JWT 보안 설정
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:10080}
# CORS 설정
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
# 관리자 계정 정보
app.admin-login-id=${APP_ADMIN_LOGIN_ID}
app.admin-password=${APP_ADMIN_PASSWORD}
# 로깅 — env 토글 (prod 기본 INFO 권장)
logging.level.root=${LOG_LEVEL_ROOT:INFO}
logging.level.io.github.ladium1.erp=${LOG_LEVEL_APP:INFO}
# 콘솔 패턴 — 모든 라인에 [traceId][userId] MDC 컬럼 부착 (LoggingMdcFilter 가 요청별 채움)
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} %5p [%X{traceId:-        }] [%X{userId:-anon}] [%15.15t] %-40.40logger{39} : %m%n%wEx
# 엑셀 일괄 업로드 / 드라이브·첨부 파일 업로드 멀티파트 한도
spring.servlet.multipart.max-file-size=30MB
spring.servlet.multipart.max-request-size=32MB
# 파일 스토리지 — 로컬 디스크 저장 루트 (prod: env 로 교체, 추후 S3 구현체 전환 가능)
erp.storage.local.base-path=${STORAGE_BASE_PATH:./data/files}
# 업무에 연결되지 않은 업로드는 하루 뒤 삭제 대상으로 전환하고 10분마다 물리 정리
erp.storage.pending-ttl=${STORAGE_PENDING_TTL:PT24H}
erp.storage.cleanup-initial-delay=${STORAGE_CLEANUP_INITIAL_DELAY:PT10M}
erp.storage.cleanup-interval=${STORAGE_CLEANUP_INTERVAL:PT10M}
erp.storage.cleanup.enabled=${STORAGE_CLEANUP_ENABLED:true}
# 근태 — 회사 위치 기준 출퇴근 판정 (기본값: 서울시청 좌표, 실제 배포 시 env 로 교체)
erp.attendance.office.latitude=${ATTENDANCE_OFFICE_LAT:37.5663}
erp.attendance.office.longitude=${ATTENDANCE_OFFICE_LNG:126.9779}
erp.attendance.office.allowed-radius-meters=${ATTENDANCE_OFFICE_RADIUS:300}
# 데모 — 기본값은 기존 운영 동작을 그대로 유지
demo.enabled=${DEMO_ENABLED:false}
demo.environment-name=${DEMO_ENVIRONMENT_NAME:DEMO}
demo.state-path=${DEMO_STATE_PATH:./data/demo-state/state.json}
demo.notice=${DEMO_NOTICE:모든 데이터는 합성 데이터이며 주기적으로 초기화됩니다.}
demo.reset.warning-before=${DEMO_RESET_WARNING_BEFORE:PT5M}
demo.reset.write-lock-before=${DEMO_RESET_WRITE_LOCK_BEFORE:PT2M}
demo.reset.operation-timeout=${DEMO_RESET_OPERATION_TIMEOUT:PT20M}
demo.audit.store-client-ip=${DEMO_AUDIT_STORE_CLIENT_IP:true}
demo.geolocation.use-simulated-position=${DEMO_USE_SIMULATED_POSITION:false}
demo.geolocation.latitude=${DEMO_SIMULATED_LATITUDE:37.5663}
demo.geolocation.longitude=${DEMO_SIMULATED_LONGITUDE:126.9779}
demo.upload.enabled=${DEMO_UPLOAD_ENABLED:true}
demo.upload.account-quota-bytes=${DEMO_UPLOAD_ACCOUNT_QUOTA_BYTES:268435456}
demo.upload.account-quota-files=${DEMO_UPLOAD_ACCOUNT_QUOTA_FILES:16}
demo.upload.generation-quota-bytes=${DEMO_UPLOAD_GENERATION_QUOTA_BYTES:536870912}
demo.upload.generation-quota-files=${DEMO_UPLOAD_GENERATION_QUOTA_FILES:32}
demo.upload.min-free-bytes=${DEMO_UPLOAD_MIN_FREE_BYTES:5368709120}
demo.upload.min-free-ratio=${DEMO_UPLOAD_MIN_FREE_RATIO:0.20}
demo.upload.max-concurrent-transfers=${DEMO_MAX_CONCURRENT_TRANSFERS:2}
demo.upload.max-concurrent-uploads-per-account=${DEMO_MAX_CONCURRENT_UPLOADS_PER_ACCOUNT:1}
demo.upload.max-concurrent-downloads-per-account=${DEMO_MAX_CONCURRENT_DOWNLOADS_PER_ACCOUNT:2}
demo.upload.excel-account-quota-rows=${DEMO_EXCEL_ACCOUNT_QUOTA_ROWS:500}
demo.upload.excel-generation-quota-rows=${DEMO_EXCEL_GENERATION_QUOTA_ROWS:1000}
demo.protection.protected-login-ids=${DEMO_PROTECTED_LOGIN_IDS:demo.manager,demo.staff}
demo.protection.protected-role-codes=${DEMO_PROTECTED_ROLE_CODES:MASTER,DEMO_MANAGER,DEMO_STAFF}
demo.protection.operations-admin-login-id=${APP_ADMIN_LOGIN_ID:}
demo.rate-limit.window=${DEMO_RATE_LIMIT_WINDOW:PT1M}
demo.rate-limit.login-limit=${DEMO_LOGIN_RATE_LIMIT:10}
demo.rate-limit.login-global-limit=${DEMO_LOGIN_GLOBAL_RATE_LIMIT:30}
demo.rate-limit.write-limit=${DEMO_WRITE_RATE_LIMIT:60}
demo.rate-limit.write-global-limit=${DEMO_WRITE_GLOBAL_RATE_LIMIT:90}
demo.rate-limit.ingress-limit=${DEMO_INGRESS_RATE_LIMIT:300}
demo.rate-limit.ingress-global-limit=${DEMO_INGRESS_GLOBAL_RATE_LIMIT:600}
demo.rate-limit.max-concurrent-ingress=${DEMO_MAX_CONCURRENT_INGRESS:8}
demo.rate-limit.max-concurrent-writes=${DEMO_MAX_CONCURRENT_WRITES:4}
demo.rate-limit.read-limit=${DEMO_READ_RATE_LIMIT:120}
demo.rate-limit.read-global-limit=${DEMO_READ_GLOBAL_RATE_LIMIT:180}
demo.rate-limit.preview-limit=${DEMO_PREVIEW_RATE_LIMIT:20}
demo.rate-limit.preview-global-limit=${DEMO_PREVIEW_GLOBAL_RATE_LIMIT:30}
demo.rate-limit.max-concurrent-reads=${DEMO_MAX_CONCURRENT_READS:4}
demo.rate-limit.max-concurrent-previews=${DEMO_MAX_CONCURRENT_PREVIEWS:2}
demo.rate-limit.upload-limit=${DEMO_UPLOAD_RATE_LIMIT:10}
demo.rate-limit.upload-global-limit=${DEMO_UPLOAD_GLOBAL_RATE_LIMIT:16}
demo.rate-limit.excel-upload-limit=${DEMO_EXCEL_UPLOAD_RATE_LIMIT:2}
demo.rate-limit.excel-upload-global-limit=${DEMO_EXCEL_UPLOAD_GLOBAL_RATE_LIMIT:2}
demo.rate-limit.download-limit=${DEMO_DOWNLOAD_RATE_LIMIT:20}
demo.rate-limit.download-global-limit=${DEMO_DOWNLOAD_GLOBAL_RATE_LIMIT:30}
demo.rate-limit.download-byte-window=${DEMO_DOWNLOAD_BYTE_RATE_WINDOW:PT1H}
demo.rate-limit.download-byte-limit=${DEMO_DOWNLOAD_BYTE_RATE_LIMIT:67108864}
demo.rate-limit.download-global-byte-limit=${DEMO_DOWNLOAD_GLOBAL_BYTE_RATE_LIMIT:100663296}
demo.rate-limit.max-tracked-keys=${DEMO_RATE_LIMIT_MAX_KEYS:10000}
demo.excel.export-max-rows=${DEMO_EXCEL_EXPORT_MAX_ROWS:500}
demo.seed.validation-enabled=${DEMO_SEED_VALIDATION_ENABLED:true}
demo.seed.expected-version=${DEMO_SEED_EXPECTED_VERSION:}
demo.seed.required-file-count=${DEMO_SEED_REQUIRED_FILE_COUNT:30}
demo.seed.required-accounts=${DEMO_SEED_REQUIRED_ACCOUNTS:demo.manager:DEMO_MANAGER,demo.staff:DEMO_STAFF}
demo.seed.required-role-codes=${DEMO_SEED_REQUIRED_ROLE_CODES:MASTER,DEMO_MANAGER,DEMO_STAFF}
# 부팅 시 변경 작업 — 데모 profile 에서는 schema/reference만 끄고 복구 운영 관리자 bootstrap은 유지
app.schema-maintenance.enabled=${SCHEMA_MAINTENANCE_ENABLED:true}
app.reference-bootstrap.enabled=${REFERENCE_BOOTSTRAP_ENABLED:true}
app.admin-bootstrap.enabled=${ADMIN_BOOTSTRAP_ENABLED:true}
# Actuator — health 엔드포인트만 노출, 상세 정보 비공개
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readinessState,db
# HTTP route 템플릿이 100개를 넘는 현재 API 규모를 수용하되 비정상적인 URI tag 증가는 유한하게 차단
management.metrics.web.server.max-uri-tags=256
