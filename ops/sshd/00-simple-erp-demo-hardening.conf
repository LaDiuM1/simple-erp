# Dedicated demo host: key-only ec2-user access, no SSH privilege or tunnel surface.
# OpenSSH uses the first value it reads, so this drop-in sorts before cloud-init defaults.
PermitRootLogin no
PubkeyAuthentication yes
PasswordAuthentication no
KbdInteractiveAuthentication no
X11Forwarding no
AllowAgentForwarding no
AllowTcpForwarding no
PermitTunnel no
